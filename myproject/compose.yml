# Development environment:  docker compose up
#
#   web     Django runserver on http://localhost:8000 (code is bind-mounted)
#   assets  webpack in watch mode (writes static/bundles + webpack-stats.json)
#   db      PostgreSQL
#
# Every variable has a dev default, so a `.env` file is optional here.

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-myproject}
  POSTGRES_USER: ${POSTGRES_USER:-myproject}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myproject}

services:
  db:
    image: postgres:17
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Uncomment to reach the database from the host (e.g. a DB client):
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key}
      DATABASE_URL: postgres://${POSTGRES_USER:-myproject}:${POSTGRES_PASSWORD:-myproject}@db:5432/${POSTGRES_DB:-myproject}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
    depends_on:
      db:
        condition: service_healthy

  assets:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run watch"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  pgdata:
  node_modules:
